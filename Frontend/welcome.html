<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoByte — Кіру сәтті аяқталды</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #edf4ff; color: #172b49; font: 1rem/1.5 "Segoe UI", sans-serif; }
    main { width: min(100%, 440px); padding: 36px; border-radius: 22px; background: white; border-top: 5px solid #2163d3; box-shadow: 0 16px 48px #17388214; }
    strong { color: #1c59b9; } h1 { line-height: 1.2; overflow-wrap: anywhere; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #174dab; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main><strong>InfoByte</strong><h1>Қош келдіңіз, {{full_name}}!</h1>
    <p>Аккаунтыңызға сәтті кірдіңіз.</p><button id="logout">Аккаунттан шығу</button><p id="message" role="status"></p>
  </main>
  <script>
    document.querySelector("#logout").addEventListener("click", async () => {
      try {
        const result = await fetch("/api/sessions/current", {method: "DELETE"});
        if (!result.ok && result.status !== 401) throw new Error();
        location.replace("/infobyte-auth/login.html");
      } catch {
        document.querySelector("#message").textContent = "Серверге қосылу мүмкін болмады. Қайта көріңіз.";
      }
    });
  </script>
</body>
</html>
